name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare build metadata
        run: npm run prepare:build-info

      - name: Run unit tests
        run: npm test

      - name: Run Electron UI validation
        run: npm run test:ui

      - name: Upload UI validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Content-Editor-UI-Validation
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Windows executables
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        run: npm run build:win

      - name: Upload Windows executables
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Content-Editor-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 90

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: html-editor-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Check whether this version is already published
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release version: $version" >&2
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists. Keeping its published binaries unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tested Windows binaries
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: HTML-Content-Editor-Windows
          path: dist

      - name: Validate assets and generate SHA256 checksums
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test -s "dist/HTML-Content-Editor-Setup-${version}-x64.exe"
          test -s "dist/HTML-Content-Editor-Portable-${version}-x64.exe"
          (cd dist && sha256sum -- *.exe > SHA256SUMS.txt)

      - name: Publish GitHub Release
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_check.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HTML Content Editor $RELEASE_TAG" \
            --notes "Windows x64 installer and portable edition. Both executables are unsigned, so Windows SmartScreen may show a warning. See SHA256SUMS.txt for download integrity checks." \
            --generate-notes \
            --latest
