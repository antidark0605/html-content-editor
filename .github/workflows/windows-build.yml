name: Windows Build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Run Electron UI validation
        run: npm run test:ui

      - name: Upload UI validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Content-Editor-UI-Validation
          path: test-results/*.png
          if-no-files-found: ignore

      - name: Build Windows executables
        run: npm run build:win

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Content-Editor-Windows
          path: dist/*.exe
          if-no-files-found: error
