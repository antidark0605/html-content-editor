<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HTML Content Editor Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 60px auto;
      padding: 0 24px;
      color: #253043;
    }
    .card {
      padding: 24px;
      border: 1px solid #d5dae2;
      border-radius: 14px;
    }
    .accent {
      color: #1f6feb;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>HTML Content Editor</h1>
    <p>Edit this sentence directly in <strong class="accent">Edit mode</strong>, then switch to Preview.</p>
    <p>The surrounding HTML structure, classes, and styles should remain unchanged.</p>
  </main>
</body>
</html>
